name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CI: true
      TZ: UTC
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and package app
        run: |
          npm run build
          npx electron-builder --config release.config.json --publish never

      - name: List release directory
        run: ls -la release || true

      - name: Generate checksums
        run: node scripts/generate-checksums.mjs

      - name: Upload artifacts and checksums
        uses: actions/upload-artifact@v4
        with:
          name: autoclick-release-${{ matrix.os }}
          path: |
            release/**/*
            checksums.txt
